<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Learning Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav class="col-md-2 d-md-block bg-light sidebar">
                <div class="sidebar-header py-3 px-3 border-bottom">
                    <h4 class="mb-0">E-Learning</h4>
                </div>
                <ul class="nav flex-column" id="sidebarMenu">
                    <li class="nav-item">
                        <a class="nav-link" href="#/dashboard" data-bs-toggle="collapse">
                            <i class="bi bi-house-door"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item" id="nav-users">
                        <a class="nav-link" href="#/users">
                            <i class="bi bi-people"></i> Users
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#/materi">
                            <i class="bi bi-book"></i> Materi
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#/tugas">
                            <i class="bi bi-clipboard-check"></i> Tugas
                        </a>
                    </li>
                    <li class="nav-item" id="nav-pengumpulan">
                        <a class="nav-link" href="#/pengumpulan">
                            <i class="bi bi-cloud-upload"></i> Pengumpulan
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#/presensi">
                            <i class="bi bi-clipboard-list"></i> Presensi
                        </a>
                    </li>
                    <li class="nav-item" id="nav-pembayaran">
                        <a class="nav-link" href="#/pembayaran">
                            <i class="bi bi-credit-card"></i> Pembayaran
                        </a>
                    </li>
                    <hr>
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="logoutBtn">
                            <i class="bi bi-box-arrow-right"></i> Logout
                        </a>
                    </li>
                </ul>
            </nav>

            <!-- Main content -->
            <main class="col-md-10 ms-sm-auto px-md-4">
                <!-- Top navbar -->
                <div class="d-flex justify-content-between align-items-center py-3 border-bottom">
                    <h1 class="h3" id="pageTitle">Dashboard</h1>
                    <div>
                        <span class="me-3">
                            <i class="bi bi-person-circle"></i>
                            <span id="userNameDisplay">User</span>
                        </span>
                    </div>
                </div>

                <!-- Alert container -->
                <div class="alert-container mt-3"></div>

                <!-- Content -->
                <div id="contentArea"></div>
            </main>
        </div>
    </div>

    <!-- Login Modal -->
    <div class="modal fade" id="loginModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Login</h5>
                </div>
                <div class="modal-body">
                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="loginUsername" class="form-label">Username</label>
                            <input type="text" class="form-control" id="loginUsername" required>
                        </div>
                        <div class="mb-3">
                            <label for="loginPassword" class="form-label">Password</label>
                            <input type="password" class="form-control" id="loginPassword" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Login</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api-client.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/modules/dashboard.js"></script>
    <script src="js/modules/users.js"></script>
    <script src="js/modules/materi.js"></script>
    <script src="js/modules/tugas.js"></script>
    <script src="js/modules/pengumpulan.js"></script>
    <script src="js/modules/presensi.js"></script>
    <script src="js/modules/pembayaran.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
