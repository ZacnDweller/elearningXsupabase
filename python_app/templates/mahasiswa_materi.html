{% extends 'base.html' %}
{% block content %}
<div class="dashboard-container">
    <h1>Materi Perkuliahan</h1>
    <div class="dashboard-section">
        <div class="table-responsive">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Judul Materi</th>
                        <th>File</th>
                    </tr>
                </thead>
                <tbody>
                    {% for item in materi %}
                    <tr>
                        <td>{{ loop.index }}</td>
                        <td>{{ item.judul }}</td>
                        <td>
                            {% if item.file %}
                            <a href="{{ url_for('download_file', filename='materi/' ~ item.file) }}" class="btn btn-sm btn-success">⬇ Download</a>
                            {% else %}
                            -
                            {% endif %}
                        </td>
                    </tr>
                    {% else %}
                    <tr>
                        <td colspan="3" class="text-center">Belum ada materi yang dibagikan.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
