{% extends 'base.html' %}
{% block content %}
<div class="dashboard-container">
    <div class="dashboard-header">
        <h1>Dashboard Mahasiswa</h1>
        <p>Selamat datang, <strong>{{ nama }}</strong></p>
    </div>

    <div class="dashboard-cards">
        <div class="card-box bg-primary text-white">
            <h3>Materi</h3>
            <p class="large-number">{{ materi_count }}</p>
        </div>
        <div class="card-box bg-success text-white">
            <h3>Tugas</h3>
            <p class="large-number">{{ tugas_count }}</p>
        </div>
        <div class="card-box bg-warning text-dark">
            <h3>Presensi</h3>
            <p class="large-number">{{ presensi_status }}</p>
        </div>
    </div>

    <div class="dashboard-section">
        <h2>Menu Cepat</h2>
        <div class="button-row">
            <a class="btn btn-primary" href="{{ url_for('mahasiswa_materi') }}">Lihat Materi</a>
            <a class="btn btn-success" href="{{ url_for('mahasiswa_tugas') }}">Lihat Tugas</a>
            <a class="btn btn-warning text-dark" href="{{ url_for('mahasiswa_presensi') }}">Isi Presensi</a>
        </div>
    </div>
</div>
{% endblock %}
